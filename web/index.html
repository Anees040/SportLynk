<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SportLynk — Book Sports Venues">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SportLynk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SportLynk</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body { margin: 0; background: #0A1F13; }
    .sl-loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0A1F13; font-family: 'Segoe UI', sans-serif;
    }
    .sl-loader img { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 18px; }
    .sl-loader h1 { color: #fff; font-size: 28px; margin: 0 0 6px 0; font-weight: 700; }
    .sl-loader h1 span { color: #22C55E; }
    .sl-loader .sl-spin {
      width: 28px; height: 28px; margin-top: 20px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #22C55E; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Loading indicator visible while Flutter engine downloads -->
  <div class="sl-loader" id="sl-loader">
    <img src="icons/Icon-192.png" alt="SportLynk" onerror="this.style.display='none'">
    <h1>Sport<span>Lynk</span></h1>
    <div class="sl-spin"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Hide loader once Flutter renders first frame
    window.addEventListener('flutter-first-frame', function() {
      var el = document.getElementById('sl-loader');
      if (el) el.remove();
    });
    // Fallback: hide after 15s even if event doesn't fire
    setTimeout(function() {
      var el = document.getElementById('sl-loader');
      if (el) el.remove();
    }, 15000);
  </script>
</body>
</html>
